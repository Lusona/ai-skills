<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="852" viewBox="0 0 1100 852" role="img" aria-labelledby="title description">
  <title id="title">Lusona: choose, act, check and refine under user authority</title>
  <desc id="description">A clockwise loop on the left illustrates eight principles shared by all skills. P1: choose a skill from the unresolved need; any skill can follow any other. P7: act on the next bounded, authorized task and pause only affected work. P5: check observed evidence against the intended outcome; failed or unrun required checks block completion. P2: refine the system and design, separating facts from assumptions and carrying the outcome, decisions, authority, TDD level, evidence and uncertainty into the next pass. User authority, P6, is at the center: records do not grant permission. A conditional branch from Check to Refine shows P3, revisiting a conflicting decision with the user, and P4, marking superseded decisions with date and source while retaining their rationale. P8: every reply names the next action and owner, or says none remains and why. On the right, all fifteen skills are grouped by need with no arrows or required sequence between them.</desc>
  <defs>
    <marker id="blue-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#245fe5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="orange-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#c44b00" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="teal-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#008174" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="purple-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#7838ce" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; font-weight: 400; fill: #14233d; }
      .headline { font-size: 29px; font-weight: 700; }
      .intro { font-size: 18px; }
      .body { font-size: 16px; }
      .step { font-size: 24px; font-weight: 700; }
      .heading { font-size: 19px; font-weight: 700; }
      .authority-heading { font-size: 20px; font-weight: 700; }
      .principle { font-size: 14px; font-weight: 700; letter-spacing: .5px; }
      .group { font-size: 15px; font-weight: 700; letter-spacing: .8px; }
      .skill { font-family: 'Liberation Mono', Consolas, monospace; font-size: 18px; font-weight: 700; }
      .purpose { font-size: 16px; fill: #3d4c63; }
      .reply-label { font-size: 17px; font-weight: 700; fill: #ffffff; }
      .reply-body { font-size: 17px; fill: #ffffff; }
      .blue { fill: #194db3; }
      .orange { fill: #a83d00; }
      .teal { fill: #006b60; }
      .purple { fill: #6730b2; }
    </style>
  </defs>

  <rect width="1100" height="852" rx="20" fill="#f8fafc"/>
  <text x="34" y="48" class="headline">Refine the system and design with each pass</text>
  <text x="35" y="78" class="intro">Choose the next bounded action. Use only the skills the work needs.</text>

  <!-- Four equal action boxes, mirrored about the loop center (365,363). -->
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <path d="M465 193 C540 208 610 249 610 297" stroke="#245fe5" marker-end="url(#blue-arrow)"/>
    <path d="M610 419 C610 470 543 518 475 533" stroke="#c44b00" marker-end="url(#orange-arrow)"/>
    <path d="M265 533 C190 518 120 470 120 429" stroke="#008174" marker-end="url(#teal-arrow)"/>
    <path d="M120 307 C120 256 187 208 255 193" stroke="#7838ce" marker-end="url(#purple-arrow)"/>
  </g>
  <text x="365" y="119" text-anchor="middle" class="principle purple">REPEAT WITH WHAT YOU LEARN</text>

  <g id="choose">
    <rect x="265" y="137" width="200" height="112" rx="16" fill="#e9f1ff" stroke="#245fe5" stroke-width="2"/>
    <text x="365" y="168" text-anchor="middle" class="step blue">Choose</text>
    <text x="365" y="190" text-anchor="middle" class="principle blue">P1 · SELECT BY NEED</text>
    <text x="365" y="215" text-anchor="middle" class="body">Any skill can follow</text>
    <text x="365" y="236" text-anchor="middle" class="body">any other skill</text>
  </g>
  <g id="act">
    <rect x="510" y="307" width="200" height="112" rx="16" fill="#fff0e4" stroke="#c44b00" stroke-width="2"/>
    <text x="610" y="338" text-anchor="middle" class="step orange">Act</text>
    <text x="610" y="360" text-anchor="middle" class="principle orange">P7 · CONTINUE</text>
    <text x="610" y="385" text-anchor="middle" class="body">Authorized bounded work</text>
    <text x="610" y="406" text-anchor="middle" class="body">Pause only affected work</text>
  </g>
  <g id="check">
    <rect x="265" y="477" width="200" height="112" rx="16" fill="#e4f6f1" stroke="#008174" stroke-width="2"/>
    <text x="365" y="508" text-anchor="middle" class="step teal">Check</text>
    <text x="365" y="530" text-anchor="middle" class="principle teal">P5 · USE EVIDENCE</text>
    <text x="365" y="555" text-anchor="middle" class="body">Check against outcome</text>
    <text x="365" y="576" text-anchor="middle" class="body">Failed / unrun ≠ complete</text>
  </g>
  <g id="refine">
    <rect x="20" y="307" width="200" height="112" rx="16" fill="#f1eaff" stroke="#7838ce" stroke-width="2"/>
    <text x="120" y="338" text-anchor="middle" class="step purple">Refine</text>
    <text x="120" y="360" text-anchor="middle" class="principle purple">P2 · NEXT PASS</text>
    <text x="120" y="385" text-anchor="middle" class="body">Facts vs. assumptions</text>
    <text x="120" y="406" text-anchor="middle" class="body">Carry accepted context</text>
  </g>

  <!-- Centered authority box: equal 50px gaps to both side action boxes. -->
  <g id="authority">
    <rect x="270" y="294" width="190" height="138" rx="18" fill="#ffffff" stroke="#194db3" stroke-width="2"/>
    <circle cx="365" cy="316" r="6" fill="#194db3"/>
    <path d="M353 334 C353 322 377 322 377 334" fill="none" stroke="#194db3" stroke-width="3" stroke-linecap="round"/>
    <text x="365" y="357" text-anchor="middle" class="authority-heading blue">Your authority</text>
    <text x="365" y="379" text-anchor="middle" class="principle blue">P6 · YOU DECIDE</text>
    <text x="365" y="400" text-anchor="middle" class="body">Outcome · scope · TDD</text>
    <text x="365" y="421" text-anchor="middle" class="body">Records ≠ permission</text>
  </g>
  <g id="authority-arrow" fill="none" stroke="#c44b00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M465 363 H496"/>
    <path d="M496 357 L504 363 L496 369"/>
  </g>

  <!-- Only a conflicting decision takes this conditional branch. -->
  <path d="M365 591 V625" fill="none" stroke="#7838ce" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#purple-arrow)"/>
  <path d="M80 631 C64 554 78 475 108 427" fill="none" stroke="#7838ce" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#purple-arrow)"/>
  <rect x="20" y="633" width="690" height="108" rx="14" fill="#f1eaff" stroke="#7838ce" stroke-width="1.7"/>
  <text x="40" y="658" class="principle purple">WHEN NEW INPUT CONFLICTS WITH A DECISION</text>
  <text x="40" y="686" class="heading">P3 · Revisit the decision with you</text>
  <text x="40" y="712" class="body">P4 · Mark the superseded choice with date and source.</text>
  <text x="40" y="733" class="body">Keep its rationale; reconcile affected records.</text>

  <!-- Unordered skill groups: every group is available on every pass. -->
  <path d="M725 123 V763" stroke="#3d4c63" stroke-width="1.2"/>
  <text x="739" y="119" class="heading">15 skills · no required sequence</text>

  <rect x="739" y="136" width="327" height="119" rx="12" fill="#ffffff"/>
  <rect x="739" y="136" width="6" height="119" rx="3" fill="#245fe5"/>
  <text x="762" y="160" class="group blue">DIRECTION &amp; COVERAGE</text>
  <text x="762" y="188" class="skill">explore</text><text x="947" y="188" class="purpose">Options</text>
  <text x="762" y="214" class="skill">frame-product</text><text x="947" y="214" class="purpose">Vision</text>
  <text x="762" y="240" class="skill">map-capabilities</text><text x="947" y="240" class="purpose">Coverage</text>

  <rect x="739" y="268" width="327" height="119" rx="12" fill="#ffffff"/>
  <rect x="739" y="268" width="6" height="119" rx="3" fill="#7838ce"/>
  <text x="762" y="292" class="group purple">BEHAVIOR &amp; DESIGN</text>
  <text x="762" y="320" class="skill">specify</text><text x="947" y="320" class="purpose">Criteria</text>
  <text x="762" y="346" class="skill">architect</text><text x="947" y="346" class="purpose">Contracts</text>
  <text x="762" y="372" class="skill">design</text><text x="947" y="372" class="purpose">Mockups</text>

  <rect x="739" y="400" width="327" height="119" rx="12" fill="#ffffff"/>
  <rect x="739" y="400" width="6" height="119" rx="3" fill="#c44b00"/>
  <text x="762" y="424" class="group orange">IMPLEMENTATION &amp; REVIEW</text>
  <text x="762" y="452" class="skill">implement</text><text x="947" y="452" class="purpose">Build</text>
  <text x="762" y="478" class="skill">refactor</text><text x="947" y="478" class="purpose">Structure</text>
  <text x="762" y="504" class="skill">review</text><text x="947" y="504" class="purpose">Defects</text>

  <rect x="739" y="532" width="327" height="119" rx="12" fill="#ffffff"/>
  <rect x="739" y="532" width="6" height="119" rx="3" fill="#008174"/>
  <text x="762" y="556" class="group teal">QUESTIONS &amp; EVIDENCE</text>
  <text x="762" y="584" class="skill">investigate</text><text x="947" y="584" class="purpose">Causes</text>
  <text x="762" y="610" class="skill">measure</text><text x="947" y="610" class="purpose">Magnitude</text>
  <text x="762" y="636" class="skill">experiment</text><text x="947" y="636" class="purpose">Trials</text>

  <rect x="739" y="664" width="327" height="99" rx="12" fill="#e9f1ff"/>
  <rect x="739" y="664" width="6" height="99" rx="3" fill="#245fe5"/>
  <text x="762" y="688" class="group blue">COORDINATION · ANYWHERE</text>
  <text x="762" y="710" class="skill">status</text><text x="947" y="710" class="purpose">Progress</text>
  <text x="762" y="732" class="skill">batch</text><text x="947" y="732" class="purpose">Unattended</text>
  <text x="762" y="754" class="skill">setup</text><text x="947" y="754" class="purpose">Preparation</text>

  <rect x="35" y="787" width="1031" height="42" rx="10" fill="#14233d"/>
  <text x="54" y="814" class="reply-label">P8 · Every reply: next action + owner</text>
  <text x="455" y="814" class="reply-body">Or state that none remains and why.</text>
</svg>
